<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .IsEdit}}Lagerort bearbeiten{{else}}Lagerort hinzufügen{{end}} - Wo ist Was?</title>
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1><a href="/">📦 Wo ist Was?</a></h1>
            <ul class="nav-menu">
                <li><a href="/">Startseite</a></li>
                <li><a href="/locations" class="active">Lagerorte</a></li>
                <li><a href="/items">Gegenstände</a></li>
                <li><a href="/search">Suchen</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="page-header">
            <h2>{{if .IsEdit}}Lagerort bearbeiten{{if .Location}}: {{.Location.Name}}{{end}}{{else}}Neuen Lagerort hinzufügen{{end}}</h2>
            <a href="/locations" class="btn btn-secondary">← Zurück zu den Lagerorten</a>
        </div>

        <form class="form" method="POST">
            {{if .IsEdit}}
            <input type="hidden" name="id" value="{{.Location.ID}}">
            {{end}}
            
            <div class="form-group">
                <label for="name">Name *</label>
                <input type="text" id="name" name="name" value="{{if .Location}}{{.Location.Name}}{{end}}" required>
            </div>

            <div class="form-group">
                <label for="description">Beschreibung</label>
                <textarea id="description" name="description" rows="3">{{if .Location}}{{.Location.Description}}{{end}}</textarea>
            </div>

            <div class="form-group">
                <label for="parent_id">Übergeordneter Lagerort</label>
                <select id="parent_id" name="parent_id">
                    <option value="" {{if or (not .Location) (not .Location.ParentID)}}selected{{end}}>Keiner (Oberste Ebene)</option>
                    {{range .Locations}}
                    <option value="{{.ID}}" {{if and $.Location $.Location.ParentID (eq .ID (deref $.Location.ParentID))}}selected{{end}}>{{.Path}}</option>
                    {{end}}
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">{{if .IsEdit}}Lagerort aktualisieren{{else}}Lagerort erstellen{{end}}</button>
                <a href="/locations" class="btn btn-secondary">Abbrechen</a>
            </div>
        </form>
    </main>
</body>
</html>
