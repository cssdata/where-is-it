<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gegenstand bearbeiten - Wo ist Was?</title>
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1><a href="/">📦 Wo ist Was?</a></h1>
            <ul class="nav-menu">
                <li><a href="/">Startseite</a></li>
                <li><a href="/locations">Lagerorte</a></li>
                <li><a href="/items" class="active">Gegenstände</a></li>
                <li><a href="/search">Suchen</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="page-header">
            <h2>Gegenstand bearbeiten</h2>
            <a href="/items" class="btn btn-secondary">← Zurück zu den Gegenständen</a>
        </div>

        <form class="form" method="POST">
            <div class="form-group">
                <label for="name">Name *</label>
                <input type="text" id="name" name="name" required value="{{.Item.Name}}" placeholder="z.B. M4 ISO XYZ Schrauben">
            </div>

            <div class="form-group">
                <label for="description">Beschreibung</label>
                <textarea id="description" name="description" rows="3" placeholder="Zusätzliche Details zum Gegenstand">{{.Item.Description}}</textarea>
            </div>

            <div class="form-group">
                <label for="location_id">Lagerort *</label>
                <select id="location_id" name="location_id" required onchange="loadPositions()">
                    <option value="">Lagerort auswählen</option>
                    {{range .Locations}}
                    <option value="{{.ID}}" {{if eq .ID $.Item.LocationID}}selected{{end}}>{{.Path}}</option>
                    {{end}}
                </select>
            </div>

            <div class="form-group">
                <label for="position">Position (optional)</label>
                <input type="text" id="position" name="position" value="{{.Item.Position}}" placeholder="z.B. vorn oben, hinten links, mitte" list="position-suggestions">
                <datalist id="position-suggestions">
                    {{range .Positions}}
                    <option value="{{.}}">
                    {{end}}
                </datalist>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="quantity">Menge</label>
                    <input type="number" id="quantity" name="quantity" min="0" value="{{.Item.Quantity}}">
                </div>
                <div class="form-group">
                    <label for="unit">Einheit</label>
                    <input type="text" id="unit" name="unit" value="{{.Item.Unit}}" placeholder="Stück, kg, Liter, usw.">
                </div>
            </div>

            <div class="form-group">
                <label for="properties">Eigenschaften</label>
                <div id="properties-container">
                    {{range $key, $value := .Item.Properties}}
                    <div class="property-row">
                        <input type="text" placeholder="Eigenschaftsname" class="property-key" value="{{$key}}">
                        <input type="text" placeholder="Wert" class="property-value" value="{{$value}}">
                        <button type="button" onclick="removeProperty(this)" class="btn-remove">×</button>
                    </div>
                    {{else}}
                    <div class="property-row">
                        <input type="text" placeholder="Eigenschaftsname (z.B. Größe)" class="property-key">
                        <input type="text" placeholder="Wert (z.B. M4)" class="property-value">
                        <button type="button" onclick="removeProperty(this)" class="btn-remove">×</button>
                    </div>
                    {{end}}
                </div>
                <button type="button" onclick="addProperty()" class="btn btn-small">Eigenschaft hinzufügen</button>
            </div>

            <div class="form-group">
                <label for="tags">Schlagwörter (durch Komma getrennt)</label>
                <input type="text" id="tags" name="tags" value="{{range $i, $tag := .Item.Tags}}{{if $i}}, {{end}}{{$tag}}{{end}}" placeholder="schrauben, befestigung, hardware">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Gegenstand aktualisieren</button>
                <a href="/items" class="btn btn-secondary">Abbrechen</a>
            </div>
        </form>
    </main>

    <script>
        function addProperty() {
            const container = document.getElementById('properties-container');
            const row = document.createElement('div');
            row.className = 'property-row';
            row.innerHTML = `
                <input type="text" placeholder="Eigenschaftsname" class="property-key">
                <input type="text" placeholder="Wert" class="property-value">
                <button type="button" onclick="removeProperty(this)" class="btn-remove">×</button>
            `;
            container.appendChild(row);
        }

        function removeProperty(button) {
            button.parentElement.remove();
        }

        async function loadPositions() {
            const locationSelect = document.getElementById('location_id');
            const positionInput = document.getElementById('position');
            const datalist = document.getElementById('position-suggestions');
            
            const locationId = locationSelect.value;
            if (!locationId) {
                datalist.innerHTML = '';
                return;
            }
            
            try {
                const response = await fetch(`/api/positions?location_id=${locationId}`);
                if (response.ok) {
                    const positions = await response.json();
                    datalist.innerHTML = positions.map(pos => `<option value="${pos}">`).join('');
                }
            } catch (error) {
                console.error('Error loading positions:', error);
            }
        }

        // Load positions on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadPositions();
        });

        // Collect properties on form submit
        document.querySelector('form').addEventListener('submit', function(e) {
            const properties = {};
            const rows = document.querySelectorAll('.property-row');
            rows.forEach(row => {
                const key = row.querySelector('.property-key').value.trim();
                const value = row.querySelector('.property-value').value.trim();
                if (key && value) {
                    properties[key] = value;
                }
            });
            
            // Add hidden input with properties
            const hiddenInput = document.createElement('input');
            hiddenInput.type = 'hidden';
            hiddenInput.name = 'properties';
            hiddenInput.value = JSON.stringify(properties);
            this.appendChild(hiddenInput);
        });
    </script>
</body>
</html>
