version: '3.8'

services:
  where-is-it:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/root/data
    restart: unless-stopped
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3